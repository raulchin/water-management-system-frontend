<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34217E"/>
      <stop offset="50%" stop-color="#3B2B8F"/>
      <stop offset="100%" stop-color="#2C1E6E"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="35%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#34217E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F3E6FF"/>
      <stop offset="100%" stop-color="#8B4CF6"/>
    </linearGradient>
    <linearGradient id="dropBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70E9FF"/>
      <stop offset="60%" stop-color="#2384E8"/>
      <stop offset="100%" stop-color="#2329B8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="760" height="250" rx="0" fill="url(#bg)"/>
  <rect width="760" height="250" fill="url(#bgGlow)"/>
  <rect x="610" y="18" width="120" height="90" fill="url(#dots)" opacity="0.75"/>

  <g id="isotipo-gota" filter="url(#softShadow)">
    <path d="M93.5 14 C77 51 34 91 19 137 C-2 202 49 239 94 239 C143 239 190 203 171 139 C156 88 116 55 93.5 14Z" fill="url(#dropOuter)"/>
    <path d="M100 18 C82 60 75 93 56 122 C40 147 39 177 55 200 C32 181 27 151 38 121 C52 82 79 48 100 18Z" fill="#FFFFFF"/>
    <path d="M105 82 C92 107 73 126 67 152 C58 190 84 214 113 214 C144 214 168 188 158 152 C151 124 123 105 105 82Z" fill="url(#dropBlue)"/>
    <path d="M79 139 C70 156 69 180 88 195" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
  </g>

  <g id="texto-sigap" filter="url(#textShadow)">
    <text x="220" y="104" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">SIGAP</text>
    <text x="224" y="148" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Sistema Integrado de</text>
    <text x="224" y="180" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Gestión de Agua Potable</text>
  </g>
</svg>
